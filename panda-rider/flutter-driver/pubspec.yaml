name: panda_rider_driver
description: Panda Rider - Multi-service e-hailing driver app
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.7.0
  google_maps_flutter: ^2.5.0
  google_maps_webservice: ^2.0.8
  provider: ^6.1.0
  http: ^1.1.0
  dio: ^5.3.0
  flutter_stripe: ^9.0.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  socket_io_client: ^2.0.0
  material_design_icons_flutter: ^7.0.7296
  cached_network_image: ^3.3.0
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^14.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
