name: panda_rider_customer
description: Panda Rider - Multi-service e-hailing customer app
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.7.0
  
  # Google Maps
  google_maps_flutter: ^2.5.0
  google_maps_webservice: ^2.0.8
  
  # State Management
  provider: ^6.1.0
  
  # HTTP Requests
  http: ^1.1.0
  dio: ^5.3.0
  
  # Stripe Payment
  flutter_stripe: ^9.0.0
  
  # Location Services
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  
  # Real-time
  socket_io_client: ^2.0.0
  
  # UI/UX
  material_design_icons_flutter: ^7.0.7296
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Firebase Services
  firebase_storage: ^11.5.0
  
  # Rating & Reviews
  flutter_rating_bar: ^4.0.1
  
  # Chat
  image_picker: ^1.0.4
  
  # Notifications
  flutter_local_notifications: ^14.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
